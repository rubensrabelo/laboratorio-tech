services:
  database:
    image: postgres:18.4-alpine
    container_name: postgres_app_container
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration_runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go_migration_container
    entrypoint: ["/migrate-cli", "up"]
    env_file:
      - .env
    environment:
      - DB_HOST=database
      - DB_PORT=5432
    depends_on:
      database:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go_api_container
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DB_HOST=database
      - DB_PORT=5432
    depends_on:
      migration_runner:
        condition: service_completed_successfully

volumes:
  postgres_data:
    driver: local
