spring:
  application:
    name: email

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  rabbitmq:
    addresses: ${URL_AMPQ_CLOUD}
    connection-timeout: 5000ms
    template:
      retry:
        enabled: true
        initial-interval: 2000ms
        max-retries: 3
  
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        ssl:
          trust: smtp.gmail.com 

app:
  lavinmq:
    email:
      queue: "default.email"
      exchange: "email.exchange"
      routing-key: "email.routing.key"
  logging:
    exchange: logs.exchange
    routing-key: microsservico.email.logs

logging:
  level:
    root: info

server:
  port: 8082
  servlet:
    context-path: /api/v1
