services:
  postgres-db:
    image: postgres:18-alpine
    container_name: email_postgres_container
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_email_data:/var/lib/postgresql
    restart: always

volumes:
  postgres_email_data:
